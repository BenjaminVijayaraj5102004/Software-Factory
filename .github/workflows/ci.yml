name: Continuous Integration & Delivery

on:
  push:
    branches:
      - main
      - devops
      - frontend
      - backend-connection
      - features-advanced
      - 'feature/**'
  pull_request:
    branches:
      - main
      - devops

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest httpx ruff

      - name: Lint Backend Code
        run: |
          if [ -d backend ]; then
            ruff check backend/ || echo "Lint warnings detected; continuing build."
          fi

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          if [ -d backend/tests ]; then
            python -m pytest backend/tests -v
          else
            echo "backend/tests directory not present on this branch; skipping tests."
          fi

  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            if [ -f package-lock.json ]; then
              npm ci || npm install
            else
              npm install
            fi
          else
            echo "frontend/package.json not present on this branch; skipping npm install."
          fi

      - name: Build Frontend Application
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm run build
          else
            echo "frontend/package.json not present on this branch; skipping build."
          fi

  docker-ci:
    name: Docker Containerization & Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Docker Compose Images
        run: |
          docker compose build

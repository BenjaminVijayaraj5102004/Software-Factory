name: Continuous Integration & Delivery

on:
  push:
    branches:
      - main
      - devops
      - frontend
      - backend-connection
      - features-advanced
      - 'feature/**'
  pull_request:
    branches:
      - main
      - devops

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest httpx

      - name: Lint Backend Code
        run: |
          ruff check backend/ --exit-non-zero-on-fix || echo "Lint check completed"

      - name: Run Backend Pytest Suite
        run: |
          if [ -d backend/tests ]; then
            python -m pytest backend/tests -v
          else
            echo "backend/tests directory not yet present; skipping test run."
          fi

  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "package.json not yet generated; skipping npm install."
          fi

      - name: Build Frontend Application
        working-directory: frontend
        run: |
          if [ -f package.json ]; then
            npm run build
          fi

  docker-ci:
    name: Docker Containerization & Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Docker Compose Images
        run: |
          docker compose build

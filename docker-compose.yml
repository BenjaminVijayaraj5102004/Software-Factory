# ==============================================================================
# Docker Compose Orchestration for Todo Application
# Services: backend (FastAPI), frontend (Vite SPA via Nginx), proxy (Gateway Nginx)
# Persistent Storage: SQLite named volume `todo_storage`
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: devops/docker/backend.Dockerfile
    container_name: todo-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-Todo Application}
      - VERSION=${VERSION:-1.0.0}
      - API_V1_STR=${API_V1_STR:-/api/v1}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/todo.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost", "http://localhost:80", "http://localhost:3000", "http://127.0.0.1"]}
    volumes:
      - todo_storage:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - todo-network

  frontend:
    build:
      context: .
      dockerfile: devops/docker/frontend.Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api/v1}
    container_name: todo-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - todo-network

  proxy:
    image: nginx:1.27-alpine
    container_name: todo-proxy
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./devops/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - todo-network

volumes:
  todo_storage:
    name: todo_storage_data

networks:
  todo-network:
    name: todo-network
    driver: bridge
